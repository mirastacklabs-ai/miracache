# libmiracache client on host B (the engine host). Copy to /etc/miracache/client.toml.
# No ticket file: tickets come from host A over mTLS.

[scope]
provider    = "static"
secret_file = "/run/miracache/secret"   # text lines "current = 1" and "1 = <64 hex>"; mode 0600

[[nodes]]
rails    = ["10.0.0.10:7471"]                 # RDMA CM address of host A
admin    = "10.0.0.10:9465"                   # IssueTicket over mTLS
identity = "spiffe://lab/node-1"              # always set: pins the memory node's identity

[tls]
cert = "/etc/miracache/pki/client-1.pem"
key  = "/etc/miracache/pki/client-1.key"      # mode 0600, or the client refuses to start
ca   = "/etc/miracache/pki/ca.pem"

[fabric]
protocol     = "auto"      # "roce" or "iwarp" to match host A
device       = ""          # empty = first device
ticket_batch = 4           # tickets per class per call; refilled when fewer than 2 are left

[landing]
subpool_bytes = 268435456

[crypto]
workers = 4

[lab]
static_membership = true
