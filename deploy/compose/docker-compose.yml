# miracache quick start: 3 memory nodes + a one-shot test client over soft-RoCE (rxe). Open-source Docker engine
# and the compose plugin only. Needs a Linux host or VM with an rxe device: run ./setup-rxe.sh first.
#   ./run.sh        (builds the images one at a time, then: docker compose up --abort-on-container-exit --exit-code-from client)
# Production runs under systemd on bare metal; this is a convenience path (see README.md).

x-rdma: &rdma
  network_mode: host                 # RDMA CM resolves addresses through the host's netdevs
  devices:
    - /dev/infiniband:/dev/infiniband  # rdma_cm and uverbs*: no privileged mode
  ulimits:
    memlock: { soft: -1, hard: -1 }  # registering memory with the NIC pins it
  cap_drop: [ALL]
  cap_add: [IPC_LOCK]
  security_opt: ["no-new-privileges:true"]
  # No cpu or memory cgroup limits: they would sit on the data path.

x-node: &node
  <<: *rdma
  image: miracache-quickstart-memnode
  pull_policy: never                 # built once (node1 carries the build section), never pulled
  read_only: true
  restart: "no"
  stop_grace_period: 20s
  depends_on:
    prepare: { condition: service_completed_successfully }

services:
  prepare:                           # device, IP, throw-away PKI, secret and configs -> volume "lab"
    image: miracache-quickstart-client
    pull_policy: never               # built by the client service
    network_mode: host
    user: "0:0"
    environment:
      MIRA_RDMA_DEVICE: ${MIRA_RDMA_DEVICE:-}
      MIRA_IP: ${MIRA_IP:-}
    volumes:
      - lab:/lab
      - ./scripts/prepare.sh:/prepare.sh:ro
    entrypoint: ["/bin/bash", "/prepare.sh"]

  node1:
    <<: *node
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.memnode
    command: ["--config", "/lab/node-1.toml"]
    volumes: [ "lab:/lab:ro", "node1-state:/var/lib/miracache" ]
  node2:
    <<: *node
    command: ["--config", "/lab/node-2.toml"]
    volumes: [ "lab:/lab:ro", "node2-state:/var/lib/miracache" ]
  node3:
    <<: *node
    command: ["--config", "/lab/node-3.toml"]
    volumes: [ "lab:/lab:ro", "node3-state:/var/lib/miracache" ]

  client:                            # store -> lookup -> fetch -> compare; last line PASS or FAIL: <reason>
    <<: *rdma
    image: miracache-quickstart-client
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.client
    read_only: true
    restart: "no"
    depends_on:
      prepare: { condition: service_completed_successfully }
      node1: { condition: service_started }
      node2: { condition: service_started }
      node3: { condition: service_started }
    volumes:
      - lab:/lab:ro
      - ./scripts/quickstart_check.py:/quickstart_check.py:ro
    entrypoint: ["python3", "/quickstart_check.py"]

volumes:
  lab:
  node1-state:
  node2-state:
  node3-state:
