[package]
name = "miracache-model"
version = "0.3.0"
edition = "2021"
publish = false
description = "Stateright model of the miracache correctness protocol (design spec section 8)"

[[bin]]
name = "miracache-model"
path = "src/main.rs"

[lib]
name = "miracache_model"
path = "src/lib.rs"

[dependencies]
stateright = "=0.31.0"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
