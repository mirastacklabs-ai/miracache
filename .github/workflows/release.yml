name: Release

# Runs when a release tag is pushed (alpha-X.Y.Z, beta-X.Y.Z, ga-X.Y.Z), or by hand (workflow_dispatch, input `tag`)
# for an existing tag; a manual run on a tag whose Release exists replaces that Release's assets and notes.
# Builds x86_64 Linux binaries on Ubuntu 24.04, signs the checksums with Sigstore (keyless) and creates the GitHub Release.
on:
  push:
    tags: ['alpha-*', 'beta-*', 'ga-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (alpha-X.Y.Z, beta-X.Y.Z or ga-X.Y.Z)'
        required: true
        type: string
      images_only:
        description: 'Publish only the container images; skip the binary release job (existing signed assets stay untouched)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.images_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # create the release
      id-token: write   # Sigstore keyless signing
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! [[ "$TAG" =~ ^(alpha|beta|ga)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (alpha|beta|ga-MAJOR.MINOR.PATCH)"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}  # fails if the tag does not exist
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Install build dependencies
        run: .github/scripts/ci.sh deps
      - name: Build (release preset)
        run: .github/scripts/ci.sh build release
      - name: Test (tests that need a live RDMA device are excluded)
        run: .github/scripts/ci.sh test release
      - name: Package and checksum
        run: .github/scripts/ci.sh package "$TAG"
      - name: Sign the checksums (Sigstore, keyless)
        working-directory: build/dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Release notes
        run: |
          .github/scripts/ci.sh notes "$TAG" > build/notes.md
          if [ ! -s build/notes.md ]; then echo "Release $TAG." > build/notes.md; fi
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`, then"
            echo "\`cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS\` (cosign 3.x)"
          } >> build/notes.md
      - name: Create the GitHub Release (or replace the assets of an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("build/dist/miracache-$TAG-linux-x86_64.tar.gz" build/dist/SHA256SUMS build/dist/SHA256SUMS.sigstore.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
            gh release edit "$TAG" --notes-file build/notes.md
          else
            flags=()
            case "$TAG" in alpha-* | beta-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file build/notes.md "${flags[@]}" "${assets[@]}"
          fi

  # Container images on Docker Hub. A separate job: an image failure never blocks the binary release above.
  # Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; without them the steps are skipped.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write   # Sigstore keyless signing of the images
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      NAMESPACE: mirastack
      HAVE_SECRETS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check the tag name and the Docker Hub secrets
        run: |
          if ! [[ "$TAG" =~ ^(alpha|beta|ga)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (alpha|beta|ga-MAJOR.MINOR.PATCH)"
            exit 1
          fi
          if [ "$HAVE_SECRETS" != "true" ]; then
            echo "::notice::Container images skipped: the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not both set."
          fi
      - if: env.HAVE_SECRETS == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}  # the images are built from that tag's own Dockerfiles
      - if: env.HAVE_SECRETS == 'true'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - if: env.HAVE_SECRETS == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the images
        if: env.HAVE_SECRETS == 'true'
        run: |
          MIRA_IMAGE_VERSION="$TAG" MIRA_IMAGE_NAMESPACE="$NAMESPACE" deploy/docker/build.sh --push all
      - name: Moving tag (alpha, beta, latest), digests and signatures
        if: env.HAVE_SECRETS == 'true'
        run: |
          case "$TAG" in
            alpha-*) moving=alpha ;;
            beta-*) moving=beta ;;
            ga-*) moving=latest ;;
          esac
          chan="${TAG%%-*}"
          # The moving tag follows only the newest release of its channel, so a backfill of an old tag leaves it alone.
          # Ask the repository itself: the checkout is shallow at the tag and has no other tags.
          if ! tags=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${chan}-*"); then
            echo "::error::could not list the ${chan}-* tags of ${GITHUB_REPOSITORY}"; exit 1
          fi
          newest=$(printf '%s\n' "$tags" | sed -n 's|.*refs/tags/||p' | grep -E '^(alpha|beta|ga)-[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$newest" ]; then
            echo "::error::no ${chan}-* release tag found in ${GITHUB_REPOSITORY}"; exit 1
          fi
          if [ "$TAG" = "$newest" ]; then
            move=true
          else
            move=false
            echo "::notice::$TAG is not the newest $chan release ($newest): :$moving left alone"
          fi
          : > build-images.md
          for name in miracache-memnode miracache-controller; do
            ref="docker.io/$NAMESPACE/$name"
            if [ "$move" = true ]; then
              docker tag "$ref:$TAG" "$ref:$moving"
              docker push "$ref:$moving"
            fi
            # The registry is authoritative: local RepoDigests omit the docker.io/ prefix, so never grep them.
            digest=$(docker buildx imagetools inspect "$ref:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::no valid registry digest for $ref:$TAG (got: '$digest')"; exit 1
            fi
            cosign sign --yes "$ref@$digest"
            also=""
            if [ "$move" = true ]; then also=" (also \`:$moving\`)"; fi
            echo "- \`$ref:$TAG\`$also, digest \`$digest\`" >> build-images.md
          done
          {
            echo "### Container images"
            cat build-images.md
            echo
            echo "Verify: \`cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>\` (cosign 3.x)"
          } >> "$GITHUB_STEP_SUMMARY"
