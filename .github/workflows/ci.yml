name: CI

# Runs on pull requests and on each release (push to main). Build and test commands live in
# .github/scripts/ci.sh, so a contributor can run the same steps on Ubuntu 24.04.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan, tsan]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies
        run: .github/scripts/ci.sh deps
      - name: Build
        run: .github/scripts/ci.sh build ${{ matrix.preset }}
      - name: Test (tests that need a live RDMA device are excluded)
        run: .github/scripts/ci.sh test ${{ matrix.preset }}

  go:
    name: Go controller
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum
      - name: Vet and test with the race detector
        run: .github/scripts/ci.sh go

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Unit tests
        run: .github/scripts/ci.sh python
      - name: ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install --quiet ruff==0.14.5
          PATH="$RUNNER_TEMP/ruff/bin:$PATH" .github/scripts/ci.sh ruff

  clang-format:
    name: clang-format (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check files changed by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/ci.sh format "$BASE_SHA"

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/ci.sh dco "$BASE_SHA" "$HEAD_SHA"

  gitleaks:
    name: gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Scan the tree for secrets
        run: |
          docker run --rm -v "$PWD:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /scan --no-banner --redact --exit-code 1
